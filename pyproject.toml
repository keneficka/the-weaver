[project]
name = "weaver"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andrew Kenefick", email = "apkenefick@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "log4a",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "ollama>=0.6.2",
    "pandas>=3.0.6",
    "rich>=15.0.0",
]

[project.scripts]
weaver = "weaver:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
log4a = { git = "https://github.com/keneficka/log4a.git" }
