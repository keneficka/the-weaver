services:
  weaver:
    image: python:3.11-slim
    entrypoint: ["/bin/sh", "-c"]
    command: ["apt-get update -qq && apt-get install -y -qq git && pip install -q uv && uv run weaver"]
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      OLLAMA_HOST: http://host.docker.internal:11434
    stdin_open: true
    tty: true